<div class="top-bar">
  <h1 class="titulo">{{ vm.name }}</h1>




    <div class="menu-container">
<div class="menu-item"
         ng-mouseenter="vm.menuAtivo = 'hospital'"
         ng-mouseleave="vm.menuAtivo = ''">
      <button class="menu-button">Hospitais</button>
      <div class="submenu" ng-class="{ 'show': vm.menuAtivo === 'hospital' }">
        <button ui-sref="registerHospital">Cadastrar Hospital</button>
        <button ui-sref="listHospital">Listar Hospitais</button>
      </div>
  </div>

<div class="menu-item"
         ng-mouseenter="vm.menuAtivo = 'ala'"
         ng-mouseleave="vm.menuAtivo = ''">
      <button class="menu-button">Alas</button>
      <div class="submenu" ng-class="{ 'show': vm.menuAtivo === 'ala' }">
       <button ui-sref="registerAla">Cadastrar Ala</button>
        <button ui-sref="listAla">Listar Alas</button>
      </div>
  </div>

<div class="menu-item"
         ng-mouseenter="vm.menuAtivo = 'quarto'"
         ng-mouseleave="vm.menuAtivo = ''">
      <button class="menu-button">Quartos</button>
      <div class="submenu" ng-class="{ 'show': vm.menuAtivo === 'quarto' }">
       <button ui-sref="listQuarto">Listar Quartos</button>
      </div>
  </div>

<div class="menu-item"
         ng-mouseenter="vm.menuAtivo = 'leito'"
         ng-mouseleave="vm.menuAtivo = ''">
      <button class="menu-button">Leitos</button>
      <div class="submenu" ng-class="{ 'show': vm.menuAtivo === 'leito' }">
        <button ui-sref="listLeito">Listar Leitos</button>
      </div>
  </div>

<div class="menu-item"
         ng-mouseenter="vm.menuAtivo = 'paciente'"
         ng-mouseleave="vm.menuAtivo = ''">
      <button class="menu-button">Pacientes</button>
      <div class="submenu" ng-class="{ 'show': vm.menuAtivo === 'paciente' }">
         <button ui-sref="registerPatient">Cadastrar paciente</button>
        <button ui-sref="registerAdmission">Internação</button>
        <button ui-sref="listPatient">Listar Pacientes</button>
      </div>
  </div>


</div>
</div>

<div class="logo-container" style="text-align: center; opacity: 65%;">
<img src="sg.png" width="250" height="250" alt="Logo SG">
</div>
